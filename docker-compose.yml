services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: freshsense
      POSTGRES_PASSWORD: freshsense
      POSTGRES_DB: freshsense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /code
    volumes:
      - ./backend:/code
      - ./uploads:/code/uploads
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://freshsense:freshsense@postgres:5432/freshsense
      JWT_SECRET: change-me-in-production
      UPLOAD_DIR: ./uploads
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  pgdata:
