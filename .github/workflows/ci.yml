name: FreshSense CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: freshsense
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: freshsense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freshsense -d freshsense_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg2://freshsense:ci-only-password@localhost:5432/freshsense_test
      TEST_DATABASE_URL: postgresql+psycopg2://freshsense:ci-only-password@localhost:5432/freshsense_test
      JWT_SECRET: ci-only-secret-long-enough-for-validation-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-production.lock
      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends tesseract-ocr
      - run: python -m pip install -r backend/requirements-production.lock pytest httpx pip-audit
      - run: python -m pip_audit -r backend/requirements-production.lock
      - run: alembic upgrade head
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend

  containers:
    name: Production image builds
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test the production stack
        run: |
          set -euo pipefail
          cat > .env.ci <<'EOF'
          POSTGRES_PASSWORD=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          JWT_SECRET=ci-only-secret-long-enough-for-validation-2026
          CORS_ORIGINS=https://smoke.example
          WEB_PORT=18080
          EOF
          trap 'docker compose --project-name freshsense-ci --env-file .env.ci down --volumes --remove-orphans >/dev/null 2>&1 || true; rm -f .env.ci' EXIT
          docker compose --project-name freshsense-ci --env-file .env.ci up --build -d
          docker compose --project-name freshsense-ci --env-file .env.ci exec -T api sh -ec 'test "$(id -u)" = 10001 && test -w /app/uploads'
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/api/v1/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/api/v1/health
          curl --fail --silent http://127.0.0.1:18080/login > /dev/null
